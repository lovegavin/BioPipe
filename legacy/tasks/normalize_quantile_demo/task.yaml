name: normalize_quantile_demo

sources:
  proteins:
    path: input/proteomics.csv
    dims: [protein, sample]
    labels:
      protein: {sample: 0}
      sample: builtin

steps:
  - name: impute
    inputs: [proteins]
    params:
      method: min
      dim: protein
      output: proteins_imputed

  - name: normalize
    inputs: [proteins_imputed]
    params:
      method: quantile
      dim: sample
      output: proteins_qn

  - name: describe
    inputs: [proteins_qn]