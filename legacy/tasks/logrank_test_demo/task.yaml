name: logrank_test_demo

sources:
  clinical:
    path: input/tcga_brca_clinical_raw.tsv
    dims: [sample, feature]
    labels:
      sample: {feature: 0}
      feature: builtin
    args:
      reader: csv
      sep: "\t"

steps:
  - name: logrank_test
    inputs: [clinical]
    params:
      time_label: OS_Time_nature2012
      event_label: OS_event_nature2012
      group_label: AJCC_Stage_nature2012
      group_map:
        "Stage IA": "Stage I"
        "Stage IB": "Stage I"
        "Stage IIA": "Stage II"
        "Stage IIB": "Stage II"
        "Stage IIIA": "Stage III"
        "Stage IIIB": "Stage III"
        "Stage IIIC": "Stage III"
        "Stage IV": "Stage IV"
      groups: ["Stage I", "Stage II", "Stage III", "Stage IV"]
      pairwise: true
      output: logrank_result

  - name: describe
    inputs: [logrank_result]