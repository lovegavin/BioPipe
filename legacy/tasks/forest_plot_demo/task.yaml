name: forest_plot_demo

sources:
  clinical:
    path: input/tcga_brca_clinical_raw.tsv
    dims: [sample, feature]
    labels:
      sample: {feature: 0}
      feature: builtin
    args:
      reader: csv
      sep: "\t"

steps:
  - name: cox_regression
    inputs: [clinical]
    params:
      time_label: OS_Time_nature2012
      event_label: OS_event_nature2012
      covariates:
        - Age_at_Initial_Pathologic_Diagnosis_nature2012
        - AJCC_Stage_nature2012
        - Gender_nature2012
      categorical:
        - AJCC_Stage_nature2012
        - Gender_nature2012
      output: cox_result

  - name: forest_plot
    inputs: [cox_result]
    params:
      dim: covariate
      stat_dim: statistic
      hr_label: HR
      low_label: CI_low
      high_label: CI_high
      p_label: P
      filename: forest.png
      title: "TCGA BRCA: multivariable Cox regression"
      xlabel: "Hazard ratio (95% CI)"
      sort_by: p