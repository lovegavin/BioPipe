name: single_cell_demo

sources:
  counts:
    path: ../mtx_demo/input/matrix.mtx.gz
    dims: [gene, cell]
    labels:
      gene: builtin
      cell: builtin

steps:
  # ---- QC ----
  - name: qc_metrics
    inputs: [counts]
    params:
      feature_dim: gene
      sample_dim: cell
      metrics:
        - {name: total,      op: sum}
        - {name: n_detected, op: nonzero}
      output: qc

  - name: describe
    inputs: [qc]

  - name: histogram
    inputs: [qc]
    params:
      dim: statistic
      value_label: total
      bins: 40
      filename: total_per_cell.png
      title: "Total counts per cell"
      xlabel: "Total"

  - name: histogram
    inputs: [qc]
    params:
      dim: statistic
      value_label: n_detected
      bins: 40
      filename: n_detected_per_cell.png
      title: "Detected genes per cell"
      xlabel: "n_detected"

  # ---- Filter cells by QC thresholds ----
  - name: filter_by
    inputs: [counts, qc]
    params:
      dim: cell
      rules:
        - {field: total, min: 500}
        - {field: n_detected, min: 200}
      output: cells_filtered

  - name: describe
    inputs: [cells_filtered]

  # ---- Filter genes ----
  - name: filter_min
    inputs: [cells_filtered]
    params:
      dim: gene
      min_value: 1
      min_samples: 3
      output: genes_filtered

  - name: describe
    inputs: [genes_filtered]

  # ---- Normalize + log ----
  - name: normalize
    inputs: [genes_filtered]
    params:
      method: cpm
      dim: cell
      target_sum: 1000000
      output: cpm

  - name: log_transform
    inputs: [cpm]
    params:
      base: 2
      pseudocount: 1
      output: logged

  # ---- HVG + scale ----
  - name: rank_axis
    inputs: [logged]
    params:
      dim: gene
      by: variance
      top_n: 2000
      output: hvg

  - name: scale_features
    inputs: [hvg]
    params:
      dim: cell
      max_value: 10
      output: scaled

  # ---- PCA ----
  - name: reduce
    inputs: [scaled]
    params:
      dim: gene
      method: pca
      n_components: 50
      output: pcs

  - name: describe
    inputs: [pcs]

  # ---- UMAP ----
  - name: reduce
    inputs: [pcs]
    params:
      dim: component
      method: umap
      n_components: 2
      n_neighbors: 15
      min_dist: 0.3
      output: umap

  - name: describe
    inputs: [umap]

  - name: scatter
    inputs: [umap]
    params:
      dim: component
      x_label: UMAP1
      y_label: UMAP2
      filename: umap.png
      title: "UMAP projection"
      xlabel: "UMAP1"
      ylabel: "UMAP2"
