name: ml_regression_route_demo

sources:
  proteins:
    path: input/proteomics_raw.txt
    dims: [protein, sample]
    labels:
      protein: {sample: 0}
      sample: builtin
    args: {reader: csv, sep: "\t"}
  clinical:
    path: input/clinical_raw.txt
    dims: [sample, feature]
    labels:
      sample: {feature: 0}
      feature: builtin
    args: {reader: csv, sep: "\t"}

steps:
  - name: missing
    inputs: [proteins]
    params: {dim: protein, threshold: 0.5, output: prot_filtered}
  - name: impute
    inputs: [prot_filtered]
    params: {method: min, dim: protein, output: prot_imputed}
  - name: normalize
    inputs: [prot_imputed]
    params: {method: quantile, dim: sample, output: prot_qn}
  - name: log_transform
    inputs: [prot_qn]
    params: {base: 2, pseudocount: 1, output: prot_log}
  - name: transpose
    inputs: [prot_log]
    params: {order: [sample, protein], output: samples_by_protein}

  - name: ridge_regression
    inputs: [samples_by_protein, clinical]
    params:
      sample_dim: sample
      feature_dim: protein
      label_dim: feature
      target_label: Age
      alpha: 10.0
      test_size: 0.25
      cv_folds: 3
      random_state: 42
      output: ridge

  - name: random_forest_regressor
    inputs: [samples_by_protein, clinical]
    params:
      sample_dim: sample
      feature_dim: protein
      label_dim: feature
      target_label: Age
      n_estimators: 200
      test_size: 0.25
      cv_folds: 3
      random_state: 42
      output: rf

  - name: gradient_boosting_regressor
    inputs: [samples_by_protein, clinical]
    params:
      sample_dim: sample
      feature_dim: protein
      label_dim: feature
      target_label: Age
      n_estimators: 100
      learning_rate: 0.1
      max_depth: 3
      test_size: 0.25
      cv_folds: 3
      random_state: 42
      output: gb

  - name: describe
    inputs: [ridge]
  - name: describe
    inputs: [rf]
  - name: describe
    inputs: [gb]
