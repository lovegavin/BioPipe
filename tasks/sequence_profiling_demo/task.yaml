name: sequence_profiling_demo

sources:
  seqs:
    path: input/sequences.fasta
    dims: [sequence, position]
    labels:
      sequence: builtin
      position: auto

steps:
  # ---- 特征 A：组成 ----
  - name: sequence_stats
    inputs: [seqs]
    params: {output: stats}

  - name: describe
    inputs: [stats]

  - name: histogram
    inputs: [stats]
    params:
      dim: statistic
      value_label: gc
      bins: 10
      filename: gc_hist.png
      title: "GC content per sequence"
      xlabel: "GC fraction"

  - name: scatter
    inputs: [stats]
    params:
      dim: statistic
      x_label: length
      y_label: gc
      filename: length_gc.png
      title: "Length vs GC"
      xlabel: "Length (bp)"
      ylabel: "GC fraction"

  # ---- 特征 B：3-mer 谱 ----
  - name: kmer_count
    inputs: [seqs]
    params: {k: 3, output: kmers}

  - name: describe
    inputs: [kmers]

  - name: heatmap
    inputs: [kmers]
    params:
      dim: kmer
      other_dim: sequence
      select: variance
      top_n: 30
      standardize: row
      cluster_rows: true
      cluster_cols: true
      filename: kmer_heatmap.png
      title: "Top-30 3-mers per sequence"

  # ---- 特征 C：ORF 结构 ----
  - name: find_orfs
    inputs: [seqs]
    params: {min_aa: 50, output: orfs}

  - name: describe
    inputs: [orfs]

  - name: histogram
    inputs: [orfs]
    params:
      dim: statistic
      value_label: length_aa
      bins: 40
      filename: orf_lengths.png
      title: "ORF length distribution (min_aa=50)"
      xlabel: "Amino acids"

  # ---- 特征 D：motif ----
  - name: motif_scan
    inputs: [seqs]
    params:
      motifs:
        TATA_box: "TATAAA"
        polyA:    "AATAAA"
        Kozak:    "GCCACC"
        ATG:      "ATG"
        stop:     "TAA"
      output: motifs

  - name: describe
    inputs: [motifs]

  - name: heatmap
    inputs: [motifs]
    params:
      dim: motif
      other_dim: sequence
      select: all
      standardize: row
      cluster_rows: false
      cluster_cols: false
      filename: motif_heatmap.png
      title: "Motif counts per sequence"
