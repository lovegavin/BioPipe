name: prioritize_demo

sources:
  variants:
    path: input/gwas-catalog-associations-full.tsv
    dims: [variant, field]
    labels:
      variant: {field: 21}
      field: builtin
    args:
      columns: ["SNPS", "P-VALUE", "OR or BETA"]

  reference:
    path: input/gwas-catalog-associations-full.tsv
    dims: [variant_id, field]
    labels:
      variant_id: {field: 21}
      field: builtin
    args:
      columns: ["SNPS", "MAPPED_GENE", "RISK ALLELE FREQUENCY"]
      info_columns:
        "RISK ALLELE FREQUENCY": risk_allele_frequency

steps:
  - name: annotate
    inputs: [variants, reference]
    params:
      target_dim: variant
      source_dim: variant_id
      fields: [MAPPED_GENE, risk_allele_frequency]
      output: annotated

  - name: filter_min
    inputs: [ annotated ]
    params:
      dim: variant
      rules:
        - field: risk_allele_frequency
          min: 0.0001
      output: annotated_nonzero

  - name: prioritize
    inputs: [annotated]
    params:
      dim: variant
      by: risk_allele_frequency
      top_n: 10
      ascending: true
      output: top_rare

  - name: describe
    inputs: [top_rare]