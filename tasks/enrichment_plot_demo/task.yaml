name: enrichment_plot_demo

sources:
  gaf:
    path: input/goa_human.gaf.gz
    dims: [annotation, field]
    labels:
      annotation: auto
      field: builtin

steps:
  - name: pivot
    inputs: [gaf]
    params:
      index_label: db_object_symbol
      columns_label: go_id
      index_name: gene
      columns_name: go_term
      agg: first
      output: universe

  - name: rank_axis
    inputs: [universe]
    params:
      dim: gene
      by: sum
      top_n: 2000
      output: hits

  - name: enrich_go
    inputs: [hits, universe]
    params:
      gene_dim: gene
      term_dim: go_term
      correction: fdr
      min_term_size: 20
      output: enriched

  - name: enrichment_plot
    inputs: [enriched]
    params:
      q_column: Q_VALUE
      size_column: n_hit
      top_n: 20
      filename: enrichment.png
      title: "GO enrichment (top 2000 genes by annotation count)"

  - name: describe
    inputs: [enriched]