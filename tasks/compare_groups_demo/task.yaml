name: compare_groups_demo

sources:
  counts:
    path: input/airway_counts.csv
    dims: [gene, sample]
    labels:
      gene: {sample: 0}
      sample: builtin
  meta:
    path: input/airway_colData.csv
    dims: [sample, feature]
    labels:
      sample: {feature: 0}
      feature: builtin

steps:
  - name: filter_min
    inputs: [counts]
    params:
      dim: gene
      min_value: 10
      min_samples: 3
      output: counts_filtered

  - name: compare_groups
    inputs: [counts_filtered, meta]
    params:
      dim: gene
      group_dim: sample
      group_label: dex
      group_a: untrt
      group_b: trt
      method: deseq2
      output: de_result

  - name: describe
    inputs: [de_result]