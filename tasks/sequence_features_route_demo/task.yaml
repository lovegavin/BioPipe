name: sequence_features_route_demo

sources:
  seqs:
    path: input/sequences.fasta
    dims: [sequence, position]
    labels:
      sequence: builtin
      position: auto

steps:
  - name: sequence_stats
    inputs: [seqs]
    params: {output: stats}

  - name: describe
    inputs: [stats]

  - name: find_orfs
    inputs: [seqs]
    params: {output: orfs}

  - name: describe
    inputs: [orfs]

  - name: motif_scan
    inputs: [seqs]
    params:
      motifs:
        TATA: TATAAA
        SP1: GGGCGG
      output: motif_hits

  - name: describe
    inputs: [motif_hits]

  - name: histogram
    inputs: [stats]
    params:
      dim: statistic
      value_label: length
      bins: 30
      filename: seq_length_hist.png
      title: "Sequence lengths"
      xlabel: "Length (nt)"

  - name: histogram
    inputs: [stats]
    params:
      dim: statistic
      value_label: gc
      bins: 30
      filename: gc_hist.png
      title: "GC content per sequence"
      xlabel: "GC fraction"

  - name: histogram
    inputs: [orfs]
    params:
      dim: statistic
      value_label: length_aa
      bins: 40
      filename: orf_length_hist.png
      title: "ORF lengths"
      xlabel: "Length (aa)"
