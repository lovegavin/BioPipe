name: cox_regression_demo

sources:
  clinical:
    path: input/tcga_brca_clinical_raw.tsv
    dims: [sample, feature]
    labels:
      sample: {feature: 0}
      feature: builtin
    args:
      reader: csv
      sep: "\t"

steps:
  - name: cox_regression
    inputs: [clinical]
    params:
      time_label: OS_Time_nature2012
      event_label: OS_event_nature2012
      covariates:
        - Age_at_Initial_Pathologic_Diagnosis_nature2012
        - AJCC_Stage_nature2012
        - Gender_nature2012
      categorical:
        - AJCC_Stage_nature2012
        - Gender_nature2012
      output: cox_result

  - name: describe
    inputs: [cox_result]