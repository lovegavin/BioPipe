pipeline: gwas
input:
  vcf: input/genotype.vcf
  phenotype: input/phenotype.csv
  covariates: null
qc:
  maf: 0.01
  missing: 0.1
  sample_missing: 0.1
  hwe: 1.0e-06
ld:
  prune: true
  r2: 0.2
  window: 50
  clump: false
  clump_r2: 0.5
  clump_window: 500
pca:
  enabled: false
  n_components: 10
  as_covariates: true
association:
  binary_model: firth
correction:
  method: bonferroni
  fdr_threshold: 0.05
plots:
  manhattan: true
  qq: true
  volcano: true
  forest: true
  maf_distribution: true
  pvalue_histogram: true
  chromosome_density: true
  effect_vs_maf: true
  pca_scatter: true
  pca_scree: true
  top_n_forest: 20
