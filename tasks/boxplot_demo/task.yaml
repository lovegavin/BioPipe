name: boxplot_demo

sources:
  counts:
    path: input/airway_counts.csv
    dims: [gene, sample]
    labels:
      gene: {sample: 0}
      sample: builtin
  meta:
    path: input/airway_colData.csv
    dims: [sample, feature]
    labels:
      sample: {feature: 0}
      feature: builtin

steps:
  - name: filter_min
    inputs: [counts]
    params:
      dim: gene
      min_value: 10
      min_samples: 3
      output: counts_filtered

  - name: normalize
    inputs: [counts_filtered]
    params:
      method: cpm
      dim: sample
      target_sum: 1e6
      output: counts_cpm

  - name: log_transform
    inputs: [counts_cpm]
    params:
      base: 2
      pseudocount: 1
      output: counts_log

  - name: transpose
    inputs: [counts_log]
    params:
      order: [sample, gene]
      output: samples_by_gene

  - name: boxplot
    inputs: [samples_by_gene, meta]
    params:
      dim: gene
      value_label: ENSG00000109906
      group_dim: sample
      group_label: dex
      filename: ZBTB16_by_dex.png
      title: "ZBTB16 expression by dex treatment"
      ylabel: "log2(CPM + 1)"