name: interval_stats_demo

sources:
  ccre:
    path: input/cCREs.bed
    dims: [region, field]
    labels:
      region: auto
      field: builtin

steps:
  - name: interval_stats
    inputs: [ccre]
    params: {output: stats}

  - name: describe
    inputs: [stats]

  - name: histogram
    inputs: [stats]
    params:
      dim: statistic
      value_label: mean_length
      bins: 40
      filename: mean_length_per_chrom.png
      title: "Mean cCRE length per chromosome"
      xlabel: "Mean length (bp)"

  - name: histogram
    inputs: [stats]
    params:
      dim: statistic
      value_label: n_intervals
      bins: 30
      filename: n_intervals_per_chrom.png
      title: "cCRE count per chromosome"
      xlabel: "Interval count"
