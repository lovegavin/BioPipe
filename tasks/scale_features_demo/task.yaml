name: scale_features_demo

sources:
  counts:
    path: ../mtx_demo/input/matrix.mtx.gz
    dims: [gene, cell]
    labels:
      gene: builtin
      cell: builtin

steps:
  - name: normalize
    inputs: [counts]
    params:
      method: cpm
      dim: cell
      output: cpm

  - name: log_transform
    inputs: [cpm]
    params:
      base: 2
      pseudocount: 1
      output: logged

  - name: scale_features
    inputs: [logged]
    params:
      dim: cell
      max_value: 10
      output: scaled

  - name: describe
    inputs: [scaled]
