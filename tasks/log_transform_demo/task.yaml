name: log_transform_demo

sources:
  counts:
    path: input/airway_counts.csv
    dims: [gene, sample]
    labels:
      gene: {sample: 0}
      sample: builtin

steps:
  - name: filter_low_count
    inputs: [counts]
    params:
      dim: gene
      min_count: 10
      min_samples: 3
      output: counts_filtered

  - name: normalize
    inputs: [counts_filtered]
    params:
      method: cpm
      dim: sample
      target_sum: 1e6
      output: counts_cpm

  - name: log_transform
    inputs: [counts_cpm]
    params:
      base: 2
      pseudocount: 1
      output: counts_log

  - name: describe
    inputs: [counts_log]