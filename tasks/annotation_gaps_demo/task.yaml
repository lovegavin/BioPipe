name: annotation_gaps_demo

sources:
  annot:
    path: input/genome.gff3.gz
    dims: [record, field]
    labels:
      record: auto
      field: builtin

steps:
  - name: annotation_gaps
    inputs: [annot]
    params:
      min_gap: 500
      output: gaps

  - name: describe
    inputs: [gaps]

  - name: histogram
    inputs: [gaps]
    params:
      dim: statistic
      value_label: gap_length
      bins: 40
      filename: gap_length_hist.png
      title: "Inter-gene gap lengths (min 500 bp)"
      xlabel: "Gap length (bp)"
