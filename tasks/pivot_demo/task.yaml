name: pivot_demo

sources:
  gaf:
    path: input/goa_human.gaf.gz
    dims: [annotation, field]
    labels:
      annotation: auto
      field: builtin

steps:
  - name: pivot
    inputs: [gaf]
    params:
      index_label: db_object_symbol
      columns_label: go_id
      index_name: gene
      columns_name: go_term
      agg: first
      output: gene_by_go

  - name: describe
    inputs: [gene_by_go]