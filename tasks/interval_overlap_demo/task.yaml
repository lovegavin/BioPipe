name: interval_overlap_demo

sources:
  ccre:
    path: input/cCREs.bed
    dims: [region, field]
    labels:
      region: auto
      field: builtin
  reg:
    path: input/ensembl_regulatory.bed
    dims: [region, field]
    labels:
      region: auto
      field: builtin

steps:
  - name: interval_overlap
    inputs: [ccre, reg]
    params:
      min_overlap: 1
      max_output: 5000000
      output: pairs

  - name: describe
    inputs: [pairs]

  - name: histogram
    inputs: [pairs]
    params:
      dim: statistic
      value_label: overlap_length
      bins: 50
      filename: overlap_length_hist.png
      title: "Overlap length (cCRE vs Ensembl regulatory)"
      xlabel: "Overlap (bp)"

  - name: histogram
    inputs: [pairs]
    params:
      dim: statistic
      value_label: overlap_fraction_a
      bins: 30
      filename: overlap_fraction_a_hist.png
      title: "cCRE fraction covered by regulatory element"
      xlabel: "overlap_fraction_a"
