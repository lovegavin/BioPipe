# Portable CPU environment. No machine-specific prefix or CUDA toolchain.
name: biopipe
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - numpy>=1.26
  - pandas>=2.0
  - pyyaml>=6.0
  - scipy>=1.11
  - statsmodels>=0.14
  - matplotlib>=3.8
  - psutil>=5.9
  - pydantic>=2.7
  - jsonschema>=4.23,<5
  - packaging>=24
  - fastapi>=0.115
  - uvicorn>=0.30
  - httpx>=0.27
  - pytest>=8.0
