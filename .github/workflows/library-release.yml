name: Independent operator library
on:
  push:
    branches: ['main', 'library/**', 'maintenance/independent-library-releases']
    tags: ['library-v*']
  pull_request:
    paths:
      - 'library/**'
      - 'scripts/*library*.py'
      - 'tests/test_library_release.py'
      - '.github/workflows/library-release.yml'
permissions:
  contents: read
env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: '1'
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install released application and analysis test dependencies
        shell: bash
        run: |
          version=$(python -c 'import json; print(json.load(open("library/release.json"))["build_application"])')
          installed=0
          for candidate in "operon_studio-${version}-py3-none-any.whl" "biopipe_studio-${version}-py3-none-any.whl"; do
            for owner in lovegavin/Operon lovegavin/BioPipe; do
              wheel_url="https://github.com/${owner}/releases/download/v${version}/${candidate}"
              if curl -fsIL "$wheel_url" >/dev/null 2>&1; then
                echo "Installing released application wheel ${wheel_url}"
                python -m pip install "$wheel_url"
                installed=1
                break 2
              fi
            done
          done
          if [ "$installed" = "0" ]; then
            echo "No released wheel for application ${version}; building it from this checkout."
            python -m pip install build
            python -m build --wheel --outdir .release-wheel .
            python -m pip install .release-wheel/operon_studio-${version}-py3-none-any.whl
          fi
          if ! python -c 'import operon' >/dev/null 2>&1; then
            echo "Installed application wheel does not provide the operon package; rebuilding from this checkout."
            python -m pip install build
            python -m build --wheel --outdir .release-wheel .
            python -m pip install --force-reinstall .release-wheel/operon_studio-${version}-py3-none-any.whl
          fi
          python -m pip install pytest h5py scikit-learn biopython rdkit
          python -m pip install "torch>=2.0" --index-url https://download.pytorch.org/whl/cpu
      - name: Validate release rules
        run: python -I -m pytest tests/test_library_release.py -q --import-mode=importlib
      - name: Build independent library
        shell: bash
        run: |
          tag=$(python -c 'import json; print("library-v" + json.load(open("library/release.json"))["version"])')
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then tag="$GITHUB_REF_NAME"; fi
          python -I scripts/release_library.py --tag "$tag" --output build/library
      - name: Verify installation, frozen routes and worker execution
        shell: bash
        run: |
          bundle=$(python -c 'import json; print(json.load(open("build/library/library-build.json"))["bundle"])')
          python -I scripts/verify_library_release.py --bundle "$bundle" --work build/library-verify
          cp build/library-verify/verification.json "build/library/verification-${{ matrix.os }}.json"
      - name: Build portable factory seed wheel
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -m pip install build
          python -m build --wheel --outdir build/library library
          cd build/library
          sha256sum operon_builtin_library-*.whl > SHA256SUMS-seed.txt
      - name: Package builtin route bundles
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p frontend/dist
          python scripts/package_routes.py --output build/library
      - uses: actions/upload-artifact@v4
        with:
          name: library-${{ matrix.os }}
          path: |
            build/library/*.operon-library.zip
            build/library/*.whl
            build/library/SHA256SUMS-*.txt
            build/library/verification-*.json
            build/library/Operon-Routes-*.zip
            build/library/Operon-Quickstart-*.zip
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/library-v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: library-*
          merge-multiple: true
          path: artifacts
      - name: Publish without replacing latest software release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ls -l artifacts
          cat artifacts/SHA256SUMS-*.txt > artifacts/SHA256SUMS.txt
          sha256sum QUICKSTART.md QUICKSTART.zh.md >> artifacts/SHA256SUMS.txt
          cp install_dependencies.py install-dependencies.sh install-dependencies.ps1 artifacts/
          sha256sum install_dependencies.py install-dependencies.sh install-dependencies.ps1 >> artifacts/SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --verify-tag --latest=false \
            --title "Operon Operator Library v${GITHUB_REF_NAME#library-v}" \
            --notes-file "docs/releases/${GITHUB_REF_NAME}.md" \
            artifacts/*.operon-library.zip artifacts/*.whl artifacts/*Routes*.zip artifacts/*Quickstart*.zip QUICKSTART.md QUICKSTART.zh.md install_dependencies.py install-dependencies.sh install-dependencies.ps1 artifacts/SHA256SUMS.txt artifacts/verification-*.json
