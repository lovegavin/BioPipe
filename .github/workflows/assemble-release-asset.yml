name: Assemble verified release asset
on:
  push:
    branches: ['release/**', 'fix/**']
    paths: ['.github/release-transfer.json']
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify, assemble and publish the exact transferred bytes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/assemble_release_asset.py .github/release-transfer.json
