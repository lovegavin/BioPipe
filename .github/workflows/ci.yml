name: Protocol and registry
on: [push, pull_request]
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      # Source-library refresh probes HDF5 and sklearn classes as well as the SDK.
      - run: python -m pip install -c constraints-py311-windows.txt -e ".[agent,dev]" "h5py>=3.10" "scikit-learn>=1.4"
      - run: python -m biopipe registry check
      - run: python scripts/build_operator_docs.py --check
      - run: python -m pytest tests/test_manifest_v3.py tests/test_contracts.py tests/test_protocol_v2.py tests/test_sdk_agent.py tests/test_builtin_pins.py tests/test_route_parameters.py tests/test_desktop.py -q
      - run: python -m pytest tests/test_headless_application.py tests/test_operator_docs.py tests/test_wheel_execution.py tests/test_memory_system.py tests/test_memory_runtime.py -q
      - run: python -m pytest tests/test_plugin_refresh.py tests/test_transfers.py tests/test_remote_transfer.py tests/test_release_build.py tests/test_release_agent_harness.py -q
