[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "biopipe-studio"
version = "3.0.2"
description = "Operon: typed bioinformatics workflows, desktop canvas and agent interfaces"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "PyYAML>=6.0", "psutil>=5.9", "pydantic>=2.7", "jsonschema>=4.23,<5", "packaging>=24", "fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "paramiko>=3.5,<5"]

[project.optional-dependencies]
analysis = ["pandas>=2.0", "scipy>=1.11", "statsmodels>=0.14", "matplotlib>=3.8"]
agent = ["mcp>=1.20,<2"]
dev = ["pytest>=8", "build>=1.2", "setuptools>=69"]

[project.scripts]
operon = "biopipe.cli:main"
biopipe = "biopipe.cli:main"

[tool.setuptools.packages.find]
include = ["biopipe*", "src*"]

[tool.setuptools.package-data]
"biopipe" = ["bundled_history.json", "guides/*.md", "viewers.json"]
"biopipe_sdk" = ["schemas/*.json"]
