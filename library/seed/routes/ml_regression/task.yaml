name: ml_regression
sources:
  proteins:
    path: input/proteomics_raw.txt
    dims:
    - protein
    - sample
    labels:
      protein:
        sample: 0
      sample: builtin
    reader: TxtReader
  clinical:
    path: input/clinical_raw.txt
    dims:
    - sample
    - feature
    labels:
      sample:
        feature: 0
      feature: builtin
    reader: TxtReader
steps:
- name: missing
  inputs:
  - proteins
- name: impute
  inputs:
  - prot_filtered
- name: normalize
  inputs:
  - prot_imputed
- name: log_transform
  inputs:
  - prot_qn
- name: transpose
  inputs:
  - prot_log
- name: ridge_regression
  inputs:
  - samples_by_protein
  - clinical
- name: random_forest_regressor
  inputs:
  - samples_by_protein
  - clinical
- name: gradient_boosting_regressor
  inputs:
  - samples_by_protein
  - clinical
- name: describe
  inputs:
  - ridge
- name: describe
  inputs:
  - rf
- name: describe
  inputs:
  - gb
parameters_file: parameters.json
