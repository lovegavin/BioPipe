name: Sequencing read QC and alignment flagstat
sources:
  reads:
    path: input/reads_1.fastq.gz
    dims:
    - file
    labels: {}
parameters_file: parameters.json
steps:
- name: fastq_stats
  inputs:
  - reads
- name: export_results
  inputs:
  - fastq_stats
- name: fastq_quality_profile
  inputs:
  - reads
- name: export_results
  inputs:
  - quality_profile
- name: fastq_adapter_scan
  inputs:
  - reads
- name: export_results
  inputs:
  - adapter_scan
- name: align_reads
  inputs:
  - reads
- name: bam_flagstat
  inputs:
  - bam
- name: export_results
  inputs:
  - bam_flagstat
runtime:
  memory:
    enabled: true
