name: rnaseq_de_demo

sources:
  counts:
    path: input/airway_counts.csv
    dims: [gene, sample]
    labels:
      gene: {sample: 0}
      sample: builtin

  meta:
    path: input/airway_colData.csv
    dims: [sample, feature]
    labels:
      sample: {feature: 0}
      feature: builtin

steps:
  # ------------------------------------------------------------------
  # 1. 过滤低表达基因
  # ------------------------------------------------------------------
  - name: filter_min
    inputs: [counts]
    params:
      dim: gene
      min_value: 10
      min_samples: 3
      output: counts_filtered

  # ------------------------------------------------------------------
  # 2. 差异表达：DESeq2 负二项 GLM
  # ------------------------------------------------------------------
  - name: compare_groups
    inputs: [counts_filtered, meta]
    params:
      dim: gene
      group_dim: sample
      group_label: dex
      group_a: untrt
      group_b: trt
      method: deseq2
      output: de_result

  # ------------------------------------------------------------------
  # 3. 可视化：火山图 + MA 图
  # ------------------------------------------------------------------
  - name: volcano
    inputs: [de_result]
    params:
      dim: gene
      stat_dim: statistic
      lfc_label: log2FC
      p_label: Q_VALUE
      lfc_threshold: 1.0
      p_threshold: 0.05
      filename: volcano.png
      title: "Airway: dex vs untrt"
      label_top: 8

  - name: ma_plot
    inputs: [de_result]
    params:
      dim: gene
      stat_dim: statistic
      lfc_label: log2FC
      mean_a_label: mean_a
      mean_b_label: mean_b
      p_label: Q_VALUE
      p_threshold: 0.05
      filename: ma.png
      title: "Airway: dex vs untrt"

  # ------------------------------------------------------------------
  # 4. 归一化 + log 变换：为下游探索性可视化准备
  # ------------------------------------------------------------------
  - name: normalize
    inputs: [counts_filtered]
    params:
      method: cpm
      dim: sample
      target_sum: 1.0e+6
      output: counts_cpm

  - name: log_transform
    inputs: [counts_cpm]
    params:
      base: 2
      pseudocount: 1
      output: counts_log

  # ------------------------------------------------------------------
  # 5. 样本聚类检查：PCA + 散点图
  # ------------------------------------------------------------------
  - name: pca
    inputs: [counts_log]
    params:
      dim: gene
      n_components: 10
      output: pcs

  - name: scatter
    inputs: [pcs]
    params:
      dim: component
      x_label: PC1
      y_label: PC2
      filename: pca.png
      title: "Sample PCA"

  # ------------------------------------------------------------------
  # 6. 热图：top 50 高变基因
  # ------------------------------------------------------------------
  - name: heatmap
    inputs: [counts_log]
    params:
      dim: gene
      other_dim: sample
      select: variance
      top_n: 50
      standardize: row
      cluster_rows: true
      cluster_cols: true
      filename: top50_heatmap.png
      title: "Top 50 variable genes"

  # ------------------------------------------------------------------
  # 7. 单基因箱线图：ZBTB16（airway 中 dex 诱导的经典 marker）
  # ------------------------------------------------------------------
  - name: transpose
    inputs: [counts_log]
    params:
      order: [sample, gene]
      output: samples_by_gene

  - name: boxplot
    inputs: [samples_by_gene, meta]
    params:
      dim: gene
      value_label: ENSG00000109906
      group_dim: sample
      group_label: dex
      filename: ZBTB16_boxplot.png
      title: "ZBTB16 by dex"
      ylabel: "log2(CPM + 1)"

  # ------------------------------------------------------------------
  # 8. 结果摘要
  # ------------------------------------------------------------------
  - name: describe
    inputs: [de_result]