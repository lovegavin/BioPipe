name: go_enrichment

sources:
  gaf:
    path: input/goa_human.gaf.gz
    dims: [annotation, field]
    labels:
      annotation: auto
      field: builtin

steps:
  - name: pivot
    inputs: [gaf]
    params:
      index_label: db_object_symbol
      columns_label: go_id
      index_name: gene
      columns_name: go_term
      agg: first
      output: universe

  - name: gene_list_to_hits
    inputs: [universe]
    params:
      genes:
        - ATM
        - ATR
        - CHEK1
        - CHEK2
        - TP53
        - MDM2
        - MDM4
        - CDKN1A
        - CDKN2A
        - GADD45A
      output: hits

  - name: enrich_go
    inputs: [hits, universe]
    params:
      gene_dim: gene
      term_dim: go_term
      correction: fdr
      min_term_size: 5
      output: enriched

  - name: enrichment_plot
    inputs: [enriched]
    params:
      q_column: Q_VALUE
      size_column: n_hit
      top_n: 20
      filename: go_enrichment_p53.png
      title: "GO enrichment: KEGG p53 signaling pathway members"

  - name: describe
    inputs: [enriched]
