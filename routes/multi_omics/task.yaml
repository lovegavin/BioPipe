name: multi_omics

sources:
  rna:
    path: input/cite_seq_pbmc.h5
    dims: [gene, cell]
    labels: {gene: builtin, cell: builtin}
    args: {feature_type: "Gene Expression"}
  protein:
    path: input/cite_seq_pbmc.h5
    dims: [protein, cell]
    labels: {protein: builtin, cell: builtin}
    args: {feature_type: "Antibody Capture"}

steps:
  - name: normalize
    inputs: [rna]
    params: {method: cpm, dim: cell, target_sum: 1e6, output: rna_cpm}
  - name: log_transform
    inputs: [rna_cpm]
    params: {base: 2, pseudocount: 1, output: rna_log}
  - name: rank_axis
    inputs: [rna_log]
    params: {dim: gene, by: variance, top_n: 2000, output: rna_hvg}
  - name: reduce
    inputs: [rna_hvg]
    params: {dim: gene, method: pca, n_components: 20, output: rna_pcs}
  - name: describe
    inputs: [rna_pcs]

  - name: normalize
    inputs: [protein]
    params: {method: total, dim: cell, output: protein_norm}
  - name: log_transform
    inputs: [protein_norm]
    params: {base: 2, pseudocount: 1, output: protein_log}
  - name: reduce
    inputs: [protein_log]
    params: {dim: protein, method: pca, n_components: 20, output: protein_pcs}
  - name: describe
    inputs: [protein_pcs]

  - name: join
    inputs: [rna_pcs, protein_pcs]
    params: {dim: cell, columns: all, how: inner, prefix: "prot_", output: joint_pcs}
  - name: describe
    inputs: [joint_pcs]

  - name: rank_axis
    inputs: [protein_log]
    params: {dim: cell, by: variance, top_n: 500, descending: true, keep_ties: false, output: protein_var}

  - name: correlation
    inputs: [protein_var]
    params: {dim: cell, metric: pearson, output: protein_corr}
  - name: heatmap
    inputs: [protein_corr]
    params:
      dim: cell
      other_dim: cell_b
      select: all
      standardize: none
      cluster_rows: false
      cluster_cols: false
      filename: protein_cell_correlation.png
      title: "Cell-cell correlation across 32 surface proteins"
