name: gtf_annotation

sources:
  annot:
    path: input/saccharomyces_cerevisiae.gtf.gz
    dims: [record, field]
    labels:
      record: auto
      field: builtin

steps:
  - name: gff_feature_stats
    inputs: [annot]
    params: {output: stats}

  - name: describe
    inputs: [stats]

  - name: gene_structure
    inputs: [annot]
    params: {output: structures}

  - name: describe
    inputs: [structures]

  - name: annotation_gaps
    inputs: [annot]
    params: {min_gap: 500, output: gaps}

  - name: describe
    inputs: [gaps]

  - name: histogram
    inputs: [structures]
    params:
      dim: statistic
      value_label: n_exons
      bins: 30
      filename: exon_count_hist.png
      title: "Exons per gene (S. cerevisiae GTF)"
      xlabel: "Exon count"

  - name: histogram
    inputs: [gaps]
    params:
      dim: statistic
      value_label: gap_length
      bins: 40
      filename: gap_length_hist.png
      title: "Inter-gene gap lengths (>= 500 bp)"
      xlabel: "Gap length (bp)"
