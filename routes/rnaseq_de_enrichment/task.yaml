name: rnaseq_de_enrichment
sources:
  counts:
    path: input/counts.csv
    dims: [gene, sample]
    labels:
      gene: {sample: 0}
      sample: builtin
  meta:
    path: input/meta.csv
    dims: [sample, feature]
    labels:
      sample: {feature: 0}
      feature: builtin
  sets:
    path: input/sets.gmt
    dims: [gene, gene_set]
    labels:
      gene: builtin
      gene_set: builtin
steps:
  - name: filter_min
    inputs: [counts]
    params: {dim: gene, min_value: 10, min_samples: 3, output: filtered}
  - name: compare_groups
    inputs: [filtered, meta]
    params:
      dim: gene
      group_dim: sample
      group_label: group
      group_a: untrt
      group_b: trt
      method: ttest
      output: de
  - name: volcano
    inputs: [de]
    params: {dim: gene, stat_dim: statistic, lfc_label: log2FC, p_label: P, filename: de_volcano.png}
  - name: ma_plot
    inputs: [de]
    params: {dim: gene, stat_dim: statistic, lfc_label: log2FC, mean_a_label: mean_a, mean_b_label: mean_b, p_label: P, filename: de_ma.png}
  - name: gsea
    inputs: [de, sets]
    params:
      gene_dim: gene
      stat_dim: statistic
      gene_set_dim: gene_set
      rank_label: log2FC
      n_permutations: 200
      min_set_size: 3
      max_set_size: 20
      seed: 7
      output: gsea
  - name: enrichment_plot
    inputs: [gsea]
    params: {term_dim: gene_set, q_column: Q_VALUE, size_column: set_size, filename: gsea.png}
  - name: describe
    inputs: [de]
    params: {}
