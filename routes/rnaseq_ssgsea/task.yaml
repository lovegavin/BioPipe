name: rnaseq_ssgsea
sources:
  counts:
    path: input/counts.csv
    dims:
    - gene
    - sample
    labels:
      gene:
        sample: 0
      sample: builtin
    reader: CsvReader
  sets:
    path: input/sets.gmt
    dims:
    - gene
    - gene_set
    labels:
      gene: builtin
      gene_set: builtin
    reader: GmtReader
steps:
- name: filter_min
  inputs:
  - counts
- name: normalize
  inputs:
  - filtered
- name: log_transform
  inputs:
  - cpm
- name: ssgsea
  inputs:
  - logged
  - sets
- name: heatmap
  inputs:
  - scores
- name: describe
  inputs:
  - scores
parameters_file: parameters.json
