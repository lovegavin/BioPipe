[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[project]
name = "operon-plot-examples"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["operon-studio>=3.0.0,<4"]
[project.entry-points."operon.operators"]
volcano = "operon_plot_examples.volcano:Volcano"
complex_heatmap = "operon_plot_examples.complex_heatmap:ComplexHeatmap"
[tool.setuptools.package-data]
operon_plot_examples = ["*.parameters.json"]
