name: mtcars_regression_classification

sources:
  comparison:
    path: input/mtcars_comparison.csv
    dims: [sample, feature]
    labels:
      sample: {feature: 0}
      feature: builtin
    args: {reader: csv}

  features:
    path: input/mtcars_features.csv
    dims: [sample, feature]
    labels:
      sample: {feature: 0}
      feature: builtin
    args: {reader: csv}

  eda:
    path: input/mtcars_eda.csv
    dims: [sample, feature]
    labels:
      sample: {feature: 0}
      feature: builtin
    args: {reader: csv}

  labels:
    path: input/mtcars_labels.csv
    dims: [sample, feature]
    labels:
      sample: {feature: 0}
      feature: builtin
    args: {reader: csv}

steps:
  - name: compare_groups
    inputs: [comparison, labels]
    params:
      dim: feature
      group_dim: sample
      group_label: am_label
      group_a: automatic
      group_b: manual
      method: welch
      output: transmission_diff

  - name: describe
    inputs: [transmission_diff]

  - name: ridge_regression
    inputs: [features, labels]
    params:
      sample_dim: sample
      feature_dim: feature
      label_dim: feature
      target_label: mpg
      alpha: 1.0
      test_size: 0.25
      cv_folds: 3
      random_state: 11
      output: mpg_ridge

  - name: describe
    inputs: [mpg_ridge]

  - name: logistic_regression
    inputs: [features, labels]
    params:
      sample_dim: sample
      feature_dim: feature
      label_dim: feature
      target_label: am
      test_size: 0.25
      cv_folds: 3
      random_state: 11
      scale: true
      penalty: l2
      C: 1000000.0
      output: am_logit

  - name: describe
    inputs: [am_logit]

  - name: random_forest_classifier
    inputs: [features, labels]
    params:
      sample_dim: sample
      feature_dim: feature
      label_dim: feature
      target_label: am_label
      valid_labels: [automatic, manual]
      n_estimators: 500
      test_size: 0.25
      cv_folds: 3
      random_state: 11
      output: am_rf

  - name: describe
    inputs: [am_rf]

  - name: pca
    inputs: [eda]
    params:
      dim: feature
      n_components: 2
      output: pcs

  - name: join
    inputs: [pcs, labels]
    params:
      dim: sample
      columns: [am_label]
      how: inner
      prefix: "label_"
      output: pcs_labeled

  - name: scatter
    inputs: [pcs_labeled]
    params:
      dim: component
      x_label: PC1
      y_label: PC2
      color_label: label_am_label
      filename: pca_by_transmission.png
      title: "mtcars: PCA by transmission"
      point_size: 28
      alpha: 0.8

  - name: correlation
    inputs: [eda]
    params:
      dim: feature
      metric: spearman
      output: mtcars_corr

  - name: heatmap
    inputs: [mtcars_corr]
    params:
      dim: feature
      other_dim: feature_b
      select: all
      standardize: none
      cluster_rows: true
      cluster_cols: true
      filename: mtcars_spearman_correlation.png
      title: "mtcars: Spearman correlation"
      cmap: RdBu_r
