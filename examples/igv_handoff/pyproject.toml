[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "operon-igv-example"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["operon-studio>=3.0.0,<4"]

[project.entry-points."operon.operators"]
genome_tracks = "operon_igv_example.tracks:GenomeTracks"

[tool.setuptools.packages.find]
include = ["operon_igv_example*"]

[tool.setuptools.package-data]
operon_igv_example = ["*.parameters.json", "*.md"]
